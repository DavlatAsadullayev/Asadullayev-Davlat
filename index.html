<style>
/* Concept: the page is a sky. Day = dawn with a slow sun, night = deep indigo with stars, a moon and aurora. Poems sit on frosted glass. */
:root {
  --bg: #f1d9ea;
  --fg: #2a1745;
  --muted: #5b4a7c;
  --line: rgba(42, 23, 69, 0.16);
  --accent: #a21f5c;
  --accent-ink: #ffffff;
  --gold: #e49b0f;
  --teal: #0f7b74;
  --glass: rgba(255, 255, 255, 0.58);
  --glass-strong: rgba(255, 255, 255, 0.88);
  --glass-line: rgba(255, 255, 255, 0.75);
  --shadow: rgba(80, 40, 120, 0.35);
  --sky-top: #c9d6ff;
  --title-grad: linear-gradient(100deg, #8f1d5a, #e0572f);
  --font-display: "Literata", Georgia, "Times New Roman", serif;
  --font-ui: "Golos Text", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #120a30;
    --fg: #f4effc;
    --muted: #bdb0da;
    --line: rgba(255, 255, 255, 0.14);
    --accent: #ff9cc6;
    --accent-ink: #1b0a2a;
    --gold: #ffd27a;
    --teal: #7be3d6;
    --glass: rgba(24, 15, 52, 0.55);
    --glass-strong: rgba(18, 11, 40, 0.84);
    --glass-line: rgba(255, 255, 255, 0.12);
    --shadow: rgba(0, 0, 0, 0.6);
    --sky-top: #04030c;
    --title-grad: linear-gradient(100deg, #ffe29a, #ffb3d1 55%, #9ad7ff);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #120a30;
  --fg: #f4effc;
  --muted: #bdb0da;
  --line: rgba(255, 255, 255, 0.14);
  --accent: #ff9cc6;
  --accent-ink: #1b0a2a;
  --gold: #ffd27a;
  --teal: #7be3d6;
  --glass: rgba(24, 15, 52, 0.55);
  --glass-strong: rgba(18, 11, 40, 0.84);
  --glass-line: rgba(255, 255, 255, 0.12);
  --shadow: rgba(0, 0, 0, 0.6);
  --sky-top: #04030c;
  --title-grad: linear-gradient(100deg, #ffe29a, #ffb3d1 55%, #9ad7ff);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 96px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--sky-top); z-index: 40; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; }
a { color: inherit; }
button, select { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* sky layers */
.sky { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.sky-day { background: linear-gradient(180deg, #c9d6ff 0%, #f7d6e8 55%, #ffe3bd 100%); opacity: 1; transition: opacity 0.9s ease; }
.sky-night { background: linear-gradient(180deg, #04030c 0%, #120a30 55%, #2b1356 100%); opacity: 0; transition: opacity 0.9s ease; }
:root[data-theme="dark"] .sky-day { opacity: 0; }
:root[data-theme="dark"] .sky-night { opacity: 1; }
.cloud { position: absolute; width: 520px; height: 160px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0)); animation: drift 70s ease-in-out infinite alternate; }
.cloud.c1 { top: 12%; left: -6%; }
.cloud.c2 { top: 42%; right: -10%; width: 640px; animation-duration: 95s; animation-delay: -30s; }
.cloud.c3 { bottom: 6%; left: 18%; width: 460px; animation-duration: 80s; animation-delay: -12s; }
.aur { position: absolute; width: 90vmax; height: 55vmax; border-radius: 50%; animation: float 26s ease-in-out infinite alternate; }
.aur.a1 { left: -30vmax; bottom: -30vmax; background: radial-gradient(closest-side, rgba(70, 210, 190, 0.42), rgba(70, 210, 190, 0)); }
.aur.a2 { right: -35vmax; bottom: -25vmax; background: radial-gradient(closest-side, rgba(255, 110, 190, 0.34), rgba(255, 110, 190, 0)); animation-duration: 32s; animation-delay: -10s; }
#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
@keyframes drift { from { transform: translateX(-4vw); } to { transform: translateX(8vw); } }
@keyframes float { from { transform: translate(0, 0) scale(1); } to { transform: translate(6vw, -6vh) scale(1.12); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { from { transform: translateY(-8px); } to { transform: translateY(10px); } }
@media (prefers-reduced-motion: reduce) { .cloud, .aur, .sun::before, .orb { animation: none !important; } }

.glass { background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2); box-shadow: 0 24px 60px -28px var(--shadow); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; padding-top: 10px; }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 60px; padding: 0 8px 0 18px; border-radius: 999px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
.brand svg { width: 34px; height: 34px; color: var(--accent); flex: none; }
.brand span { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; white-space: nowrap; }
.right { display: flex; align-items: center; gap: 4px; }
nav { display: flex; gap: 2px; }
nav a { text-decoration: none; color: var(--muted); font-size: 0.95rem; padding: 10px 14px; border-radius: 999px; }
nav a:hover { color: var(--fg); background: var(--glass-strong); }
.theme { width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--glass-strong); color: var(--fg); cursor: pointer; }
.theme:hover { color: var(--accent); }
.theme svg { width: 22px; height: 22px; }
.i-sun { display: none; }
:root[data-theme="dark"] .i-sun { display: block; }
:root[data-theme="dark"] .i-moon { display: none; }

/* hero */
.hero { --orb: clamp(150px, 24vw, 280px); display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); grid-template-areas: "copy stage" "quote stage"; column-gap: 48px; row-gap: 40px; align-items: center; padding-block: 56px 72px; }
.copy { grid-area: copy; min-width: 0; }
.stage { grid-area: stage; display: grid; place-items: center; min-height: calc(var(--orb) * 1.9); }
.quote-wrap { grid-area: quote; min-width: 0; }
.orb { position: relative; width: var(--orb); height: var(--orb); animation: bob 9s ease-in-out infinite alternate; }
.sun, .moon { position: absolute; inset: 0; border-radius: 50%; transition: opacity 0.9s ease, transform 0.9s ease; }
.sun { background: radial-gradient(circle at 35% 32%, #fffbe0 0%, #ffe08a 38%, #ffa45c 100%); box-shadow: 0 0 50px 10px rgba(255, 170, 80, 0.55), 0 0 140px 50px rgba(255, 110, 150, 0.28); }
.sun::before { content: ""; position: absolute; inset: -32%; border-radius: 50%; background: repeating-conic-gradient(rgba(255, 176, 80, 0.62) 0 3deg, transparent 3deg 12deg); -webkit-mask: radial-gradient(circle, transparent 0 58%, #000 60% 96%, transparent 100%); mask: radial-gradient(circle, transparent 0 58%, #000 60% 96%, transparent 100%); animation: spin 120s linear infinite; }
.moon { opacity: 0; transform: translateY(-45%) scale(0.8); background: radial-gradient(circle at 38% 34%, #fffdf2 0%, #f4ead0 55%, #d8c995 100%); box-shadow: 0 0 40px 8px rgba(255, 240, 190, 0.45), 0 0 120px 40px rgba(150, 130, 255, 0.3); }
.moon::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 64% 28%, rgba(120, 100, 60, 0.22) 0 7%, transparent 8%), radial-gradient(circle at 34% 62%, rgba(120, 100, 60, 0.18) 0 11%, transparent 12%), radial-gradient(circle at 70% 70%, rgba(120, 100, 60, 0.16) 0 6%, transparent 7%); }
:root[data-theme="dark"] .sun { opacity: 0; transform: translateY(45%) scale(0.8); }
:root[data-theme="dark"] .moon { opacity: 1; transform: none; }
.eyebrow { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 18px; }
.eyebrow svg, h2 svg { width: 14px; height: 14px; color: var(--gold); fill: currentColor; flex: none; }
.hero h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(2.6rem, 8vw, 5rem); line-height: 1.04; letter-spacing: -0.02em; margin: 0 0 22px; text-wrap: balance; }
.hero h1 em { font-style: italic; background: var(--title-grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 0.08em; }
.lead { color: var(--muted); font-size: 1.12rem; max-width: 44ch; margin: 0 0 30px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 30px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: 600 1rem var(--font-ui); text-decoration: none; border: 0; cursor: pointer; box-shadow: 0 14px 34px -14px var(--accent); }
.btn:hover { filter: brightness(1.08); }
.quote { margin: 0; border-radius: 18px; padding: 28px 30px; }
.quote p { margin: 0; font-family: var(--font-display); font-style: italic; font-size: clamp(1.25rem, 3vw, 1.6rem); line-height: 1.4; }
.quote cite { display: block; margin-top: 14px; font: 400 0.88rem var(--font-ui); font-style: normal; color: var(--muted); }

/* sections */
section { padding-block: 56px; }
h2 { display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-size: clamp(1.7rem, 4.5vw, 2.4rem); font-weight: 600; margin: 0 0 26px; letter-spacing: -0.01em; }

/* poems */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 0 20px; scrollbar-width: thin; }
.chip { flex: none; min-height: 42px; padding: 0 20px; border-radius: 999px; color: var(--muted); font: 500 0.92rem var(--font-ui); cursor: pointer; }
.chip:hover { color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.reader { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 28px; align-items: start; }
.poem-list { position: sticky; top: 96px; max-height: calc(100vh - 120px); overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding: 10px; border-radius: 18px; }
.poem-list button { text-align: left; background: transparent; border: 0; border-left: 3px solid transparent; border-radius: 8px; padding: 11px 14px; color: var(--muted); cursor: pointer; min-height: 46px; }
.poem-list button b { display: block; font: 600 1rem var(--font-ui); color: inherit; }
.poem-list button small { display: block; margin-top: 2px; font-size: 0.8rem; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.poem-list button:hover { color: var(--fg); background: var(--glass-strong); }
.poem-list button[aria-current="true"] { color: var(--fg); border-left-color: var(--accent); background: var(--glass-strong); }
.pick { display: none; width: 100%; min-height: 50px; padding: 0 16px; margin: 0 0 16px; border-radius: 14px; font: 500 1rem var(--font-ui); color: var(--fg); }
.page { background: var(--glass-strong); border: 1px solid var(--glass-line); border-radius: 22px; padding: clamp(26px, 5vw, 60px); min-width: 0; scroll-margin-top: 96px; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 30px 80px -34px var(--shadow); }
.page h3 { font-family: var(--font-display); font-size: clamp(1.7rem, 4.5vw, 2.5rem); font-weight: 600; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
.page h3::after { content: ""; display: block; width: 64px; height: 3px; margin: 18px 0 30px; border-radius: 3px; background: linear-gradient(90deg, var(--gold), var(--accent)); }
.stanza { font-family: var(--font-display); font-size: 1rem; line-height: 1.75; margin: 0 0 1.3em; white-space: pre-line; max-width: 48ch; overflow-wrap: anywhere; }
.poem-note { margin: 30px 0 0; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.88rem; font-style: italic; max-width: 52ch; }
.steps { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; }
.steps button { flex: 1 1 0; min-width: 0; text-align: left; min-height: 58px; padding: 10px 18px; background: transparent; border: 1px solid var(--line); border-radius: 14px; color: var(--fg); cursor: pointer; }
.steps button:hover { border-color: var(--accent); }
.steps button:disabled { opacity: 0.3; cursor: default; border-color: var(--line); }
.steps button small { display: block; font-size: 0.76rem; color: var(--muted); }
.steps button b { display: block; font: 600 0.95rem var(--font-ui); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps .next { text-align: right; }

/* about + footer */
.about .box { border-radius: 22px; padding: clamp(26px, 5vw, 48px); }
.about p { max-width: 56ch; margin: 0; font-size: 1.1rem; color: var(--muted); }
.about strong { color: var(--fg); }
footer { padding-block: 24px 36px; color: var(--muted); font-size: 0.9rem; text-align: center; }
footer svg { width: 12px; height: 12px; color: var(--gold); fill: currentColor; vertical-align: -1px; margin-inline: 8px; }

@media (max-width: 860px) {
  .hero { grid-template-columns: minmax(0, 1fr); grid-template-areas: "stage" "copy" "quote"; row-gap: 28px; padding-block: 16px 48px; --orb: 140px; }
  .stage { min-height: 230px; }
  .reader { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .poem-list { display: none; }
  .pick { display: block; }
  section { padding-block: 40px; }
}
@media (max-width: 480px) {
  nav a { padding: 10px 9px; font-size: 0.9rem; }
  .brand span { font-size: 1.05rem; }
  .top .wrap { padding-left: 14px; }
  .steps { flex-direction: column; }
}
@media (prefers-reduced-motion: no-preference) {
  .page { animation: rise 0.45s ease both; }
  .stanza, .poem-note, .steps { animation: rise 0.6s ease both; animation-delay: calc(var(--n, 0) * 70ms + 120ms); }
  .copy > *, .quote-wrap { animation: rise 0.8s ease both; }
  .copy > :nth-child(2) { animation-delay: 0.12s; }
  .copy > :nth-child(3) { animation-delay: 0.24s; }
  .copy > :nth-child(4) { animation-delay: 0.36s; }
  .quote-wrap { animation-delay: 0.5s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
}
</style>
<script>
/* day/night: saved choice first, then the device setting */
(function () {
  var t = null;
  try { t = localStorage.getItem("adTheme"); } catch (e) {}
  if (t !== "dark" && t !== "light") {
    t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>

<script>
var POEMS = [
{ title: "Бетперделер", cat: "Өмір", text: `Бетперде киген жандар,
Айналамда толды.
Тура жолдан адасып,
Бәрі қайда бет алды?

Ішкі жан дүниеде күрес,
Тоқтаусыз жүруде.
Оған қоса қайғы мұңдар,
Жүрекке салмақ түсіруде.

Бөлмені басты қараңғылық,
Ұйқысыз түндер көбейді.
Жүрекке қолып қайғы-мұң,
Жүзден күлкі көп кетті.

Шаршадым жалған дүние алдауынан,
Тынымсыз келетін сынақтардан,

Айтшы, уақыт артқа қарай қайтама?
Балалықты тағы бір рет қайтарама?
Амал жоқ тағдырға мен көнемін,
Алдымнан шам шырақ табылғанша.

Бетперделер шешілмей,
Шындықты кім айтады?

var listEl = document.getElementById("list");
var pageEl = document.getElementById("page");
var pickEl = document.getElementById("pick");
var chipsEl = document.getElementById("chips");
var filter = "Барлығы";
var current = 0;

function visible() {
  var r = [];
  POEMS.forEach(function (p, i) { if (filter === "Барлығы" || p.cat === filter) r.push(i); });
  return r;
}
function firstLine(t) { return t.split("\n")[0]; }
function mk(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function buildList() {
  listEl.innerHTML = "";
  pickEl.innerHTML = "";
  visible().forEach(function (i) {
    var p = POEMS[i];
    var b = mk("button");
    b.type = "button";
    b.setAttribute("data-i", i);
    b.appendChild(mk("b", "", p.title));
    b.appendChild(mk("small", "", firstLine(p.text)));
    b.addEventListener("click", function () { show(i, false); });
    listEl.appendChild(b);
    var o = mk("option", "", p.title);
    o.value = i;
    pickEl.appendChild(o);
  });
}

function show(i, scroll) {
  current = i;
  var p = POEMS[i];
  var vis = visible();
  var pos = vis.indexOf(i);
  Array.prototype.forEach.call(listEl.children, function (b) {
    if (Number(b.getAttribute("data-i")) === i) b.setAttribute("aria-current", "true");
    else b.removeAttribute("aria-current");
  });
  pickEl.value = String(i);

  pageEl.innerHTML = "";
  pageEl.appendChild(mk("h3", "", p.title));
  var parts = p.text.split(/\n\s*\n/);
  parts.forEach(function (s, k) {
    var d = mk("p", "stanza", s);
    d.style.setProperty("--n", Math.min(k, 10));
    pageEl.appendChild(d);
  });
  var after = Math.min(parts.length, 11);
  if (NOTES[p.title]) {
    var n = mk("p", "poem-note", NOTES[p.title]);
    n.style.setProperty("--n", after);
    pageEl.appendChild(n);
  }

  var steps = mk("div", "steps");
  steps.style.setProperty("--n", after);
  var prev = mk("button", "prev"); prev.type = "button";
  prev.appendChild(mk("small", "", "Алдыңғы"));
  var next = mk("button", "next"); next.type = "button";
  next.appendChild(mk("small", "", "Келесі"));
  if (pos > 0) { prev.appendChild(mk("b", "", "← " + POEMS[vis[pos - 1]].title)); prev.addEventListener("click", function () { show(vis[pos - 1], true); }); }
  else { prev.appendChild(mk("b", "", "—")); prev.disabled = true; }
  if (pos < vis.length - 1) { next.appendChild(mk("b", "", POEMS[vis[pos + 1]].title + " →")); next.addEventListener("click", function () { show(vis[pos + 1], true); }); }
  else { next.appendChild(mk("b", "", "—")); next.disabled = true; }
  steps.appendChild(prev); steps.appendChild(next);
  pageEl.appendChild(steps);

  if (scroll) {
    var calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    pageEl.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "start" });
  }
}

pickEl.addEventListener("change", function () { show(Number(pickEl.value), true); });

["Барлығы", "Өмір", "Махаббат", "Отан", "Білім"].forEach(function (c, ci) {
  var b = mk("button", "chip glass", c);
  b.type = "button";
  b.setAttribute("aria-pressed", ci === 0 ? "true" : "false");
  b.addEventListener("click", function () {
    filter = c;
    Array.prototype.forEach.call(chipsEl.children, function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
    buildList();
    show(visible()[0], false);
  });
  chipsEl.appendChild(b);
});

buildList();
show(0, false);
